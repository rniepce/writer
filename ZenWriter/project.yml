name: ZenWriter
options:
  bundleIdPrefix: com.zenwriter
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ZenWriter:
    type: application
    platform: macOS
    sources:
      - path: ZenWriter
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: ZenWriter
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.zenwriter.desktop
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    entitlements:
      path: ZenWriter/ZenWriter.entitlements
      properties:
        com.apple.security.app-sandbox: false
